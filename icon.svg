<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="100%" style="stop-color:#0099ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00cc66"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark Background -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#bg)"/>
  
  <!-- Grid pattern (subtle) -->
  <g opacity="0.1">
    <line x1="20" y1="0" x2="20" y2="100" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="100" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="100" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="100" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="100" y2="20" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="100" y2="40" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="100" y2="60" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="100" y2="80" stroke="#00f5ff" stroke-width="0.5"/>
  </g>
  
  <!-- Candlestick Chart Icon -->
  <g filter="url(#glow)">
    <!-- Bullish candle -->
    <rect x="35" y="35" width="10" height="30" fill="url(#green)" rx="1"/>
    <line x1="40" y1="30" x2="40" y2="70" stroke="url(#green)" stroke-width="2"/>
    
    <!-- Bearish candle -->
    <rect x="55" y="40" width="10" height="20" fill="#ff4444" rx="1"/>
    <line x1="60" y1="35" x2="60" y2="65" stroke="#ff4444" stroke-width="2"/>
  </g>
  
  <!-- AI Neural Network Nodes -->
  <g opacity="0.8">
    <circle cx="20" cy="25" r="3" fill="url(#accent)"/>
    <circle cx="80" cy="25" r="3" fill="url(#accent)"/>
    <circle cx="20" cy="75" r="3" fill="url(#accent)"/>
    <circle cx="80" cy="75" r="3" fill="url(#accent)"/>
    <circle cx="50" cy="15" r="2" fill="#00f5ff"/>
    <circle cx="50" cy="85" r="2" fill="#00f5ff"/>
    
    <!-- Connection lines -->
    <line x1="20" y1="25" x2="50" y2="15" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="25" x2="50" y2="15" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="75" x2="50" y2="85" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="75" x2="50" y2="85" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Pulse/Signal Wave -->
  <path d="M 10 50 Q 25 40 40 50 T 70 50 T 90 50" 
        fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  
  <!-- Sparkle effects -->
  <circle cx="15" cy="15" r="1.5" fill="#00f5ff" opacity="0.8"/>
  <circle cx="85" cy="85" r="1.5" fill="#00f5ff" opacity="0.8"/>
  <circle cx="85" cy="15" r="1" fill="#00f5ff" opacity="0.6"/>
  <circle cx="15" cy="85" r="1" fill="#00f5ff" opacity="0.6"/>
</svg>